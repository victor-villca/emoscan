<div class="container">
  <div class="header">
    <h1 class="app-title">EmoScan</h1>
    <div class="status-indicator">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text" class="status-text">Inactiva</span>
    </div>
    <button id="toggle-visibility" class="toggle-visibility-button">
      <span id="toggle-icon">🗙</span>
    </button>
  </div>
  <div class="main">
    <div class="action-container">
      <button id="action-button" class="action-button">
        <span>▶</span>
      </button>
      <p id="action-text" class="action-text">Iniciar Análisis</p>
    </div>

    <div class="stats-panel">
      <p class="stats-label">Participantes con Video</p>
      <div id="counter-container">
        <div id="counter" class="counter">--</div>
      </div>
      <div class="session-info">
        <span>Tiempo de Sesión</span>
        <span id="session-time">00:00:00</span>
      </div>
    </div>
  </div>
  <div class="footer">
    <div id="live-session-link-container" style="display: none">
      <a id="live-session-link" href="#" target="_blank" class="live-link">
        Ver Sesión en Vivo <i class="ri-external-link-line"></i>
      </a>
    </div>
    <span>Versión: 1.0.0</span>
  </div>

  <div id="error-banner" class="error-banner" style="display: none">
    <i class="ri-error-warning-line"></i>
    <span id="error-banner-text"></span>
  </div>
</div>
