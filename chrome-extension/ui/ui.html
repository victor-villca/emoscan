<div class="container">
    <div class="header">
        <h1 class="app-title">EmoScan</h1>
        <div class="status-indicator">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text" class="status-text">Inactiva</span>
        </div>
        <button id="toggle-visibility" class="toggle-visibility-button">
            <span id="toggle-icon">🗙</span>
        </button>
    </div>
    <div class="main">
        <div class="action-container">
            <button id="action-button" class="action-button">
                <span>▶</span>
            </button>
            <p id="action-text" class="action-text">Iniciar Captura</p>
        </div>
        <div class="options-panel">
            <div class="option-row">
                <span class="option-text">Detección automática</span>
                <label class="toggle">
                    <input type="checkbox" id="auto-detection" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        <div class="stats-panel">
            <p class="stats-label">Rostros Detectados</p>
            <div id="counter" class="counter">0</div>
            <div class="session-info">
                <span>Sesión actual</span>
                <span id="session-time">00:00:00</span>
            </div>
        </div>
    </div>
    <div class="footer">
        <span>Version: <span id="last-update">1.0.0</span></span>
        <button id="reset-button" class="reset-button">Reiniciar Sesión</button>
    </div>
</div>
